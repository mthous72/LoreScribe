name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves under /<repo>/, so the base path is set here rather than
      # hardcoded — a Capacitor build (Phase 6) needs a relative './' instead.
      # docs/15 §3d.
      - run: npm run build
        env:
          VITE_BASE: /LoreScribe/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # Prove the deployment is the BUILD and not the repository.
      #
      # GitHub's legacy branch-based Pages builder publishes the repo verbatim,
      # and if Pages "Source" is set to a branch rather than GitHub Actions it
      # runs alongside this workflow and overwrites it seconds later. Both jobs
      # report success. The only visible symptom is a blank page on whatever
      # device someone happens to open — which is how we found it the first
      # time, on a phone.
      #
      # A served index.html that still references /src/main.tsx is source, not
      # output: the build rewrites that line to a hashed asset under the base
      # path. Checking it costs one step and turns a silent misconfiguration
      # into a red run.
      - name: Verify the served page is the built output
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          for attempt in 1 2 3 4 5; do
            body=$(curl -sSL --max-time 30 "$url" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "OK: serving built assets"
              exit 0
            fi
            if printf '%s' "$body" | grep -q '/src/main.tsx'; then
              echo "::error::Pages is serving the REPOSITORY, not the build."
              echo "::error::Settings -> Pages -> Source must be 'GitHub Actions', not 'Deploy from a branch'."
              echo "::error::A branch source runs the legacy builder, which overwrites this deployment."
              exit 1
            fi
            echo "attempt $attempt: not propagated yet, waiting"
            sleep $((attempt * 10))
          done
          echo "::error::Could not confirm the built output after 5 attempts."
          printf '%s' "$body" | head -40
          exit 1
